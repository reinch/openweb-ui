services:
  open-webui:
    image: create-ai/open-webui:dev
    container_name: create-open-webui
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "3002:8080"
    environment:
      - WEBUI_SECRET_KEY=
      - ENABLE_OLLAMA_API=false
      - OPENAI_API_BASE_URL=http://sdv-backend:8000/v1
      - OPENAI_API_KEY=not-needed
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - default
      - ai-platform

networks:
  default:
    name: open-webui_default

  ai-platform:
    external: true
    name: ai-platform_default

volumes:
  open-webui-data:
